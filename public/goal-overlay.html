<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>IT Cup – Goal Scorer Overlay</title>
  <!--
    OBS Browser Source setup
    ─────────────────────────────────────────────────────
    Width: 1920  Height: 1080  (full canvas, transparent)
    ✓ Shutdown source when not visible
    ✓ Refresh browser when scene becomes active
  -->
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: transparent;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: 'Segoe UI', 'Arial Narrow', Arial, sans-serif;
    }

    /* ── Goal card — slides up from bottom ──────────────────────────────── */
    #goal-card {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      /* Off-screen by default — no transition so OBS refresh is instant */
      transform: translateY(110%);
      will-change: transform;
    }

    #goal-card.sliding-in {
      transform: translateY(0);
      transition: transform 0.65s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    #goal-card.sliding-out {
      transform: translateY(110%);
      transition: transform 0.55s cubic-bezier(0.55, 0, 1, 0.45);
    }

    /* ── Inner bar ──────────────────────────────────────────────────────── */
    .gc-bar {
      width: 100%;
      min-height: 140px;
      background: linear-gradient(100deg, var(--bg-color, #0a0d1a) 0%, color-mix(in srgb, var(--bg-color, #0a0d1a) 80%, #fff 20%) 50%, var(--bg-color, #0a0d1a) 100%);
      border-top: 3px solid var(--accent-color, #16a34a);
      box-shadow: 0 -6px 60px rgba(0,0,0,.7), 0 -2px 0 rgba(255,255,255,.04) inset;
      display: flex;
      align-items: stretch;
      overflow: hidden;
      position: relative;
    }

    /* Subtle diagonal stripe texture */
    .gc-bar::after {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        -55deg, transparent, transparent 20px,
        rgba(255,255,255,.012) 20px, rgba(255,255,255,.012) 21px
      );
      pointer-events: none;
    }

    /* ── Badge section (left) ───────────────────────────────────────────── */
    .gc-badge {
      background: var(--accent-color, #16a34a);
      background: linear-gradient(135deg, var(--accent-color, #16a34a) 0%, color-mix(in srgb, var(--accent-color, #16a34a) 70%, #000 30%) 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 14px 22px;
      min-width: 130px;
      flex-shrink: 0;
      position: relative;
      z-index: 1;
    }

    /* Angled right edge on badge */
    .gc-badge::after {
      content: '';
      position: absolute;
      right: -20px;
      top: 0; bottom: 0;
      width: 40px;
      background: var(--accent-color, #16a34a);
      background: linear-gradient(135deg, var(--accent-color, #16a34a) 0%, color-mix(in srgb, var(--accent-color, #16a34a) 70%, #000 30%) 100%);
      clip-path: polygon(0 0, 0% 100%, 100% 100%);
      z-index: -1;
    }

    .gc-badge-icon {
      width: 48px;
      height: 48px;
      filter: drop-shadow(0 2px 8px rgba(0,0,0,.5));
    }

    .gc-badge-text {
      font-size: 14px;
      font-weight: 900;
      color: #fff;
      letter-spacing: 3px;
      text-transform: uppercase;
      text-shadow: 0 2px 6px rgba(0,0,0,.4);
    }

    /* ── Team logo section ──────────────────────────────────────────────── */
    .gc-team-logo-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px 18px 12px 36px;
      flex-shrink: 0;
      border-right: 1px solid rgba(255,255,255,.07);
      transition: background .3s ease;
    }

    .gc-team-logo-wrap--bg {
      background: #ffffff;
      border-radius: 0;
      padding: 10px 16px 10px 34px;
    }

    .gc-team-logo-wrap--bg .gc-team-logo {
      filter: none;
    }

    .gc-team-logo {
      width: 78px;
      height: 62px;
      object-fit: contain;
      filter: drop-shadow(0 2px 10px rgba(0,0,0,.6));
    }

    /* ── Player section (center) ────────────────────────────────────────── */
    .gc-player {
      display: flex;
      align-items: center;
      gap: 18px;
      flex: 1;
      min-width: 0;
      padding: 14px 28px;
    }

    .gc-photo-wrap {
      width: 96px;
      height: 106px;
      flex-shrink: 0;
      overflow: hidden;
      border-radius: 4px;
      border: 2px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.06);
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .gc-photo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
    }

    .gc-photo-placeholder {
      width: 52px;
      height: 52px;
      opacity: .2;
    }

    .gc-player-info {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 5px;
      min-width: 0;
    }

    .gc-player-num {
      font-size: 13px;
      font-weight: 700;
      color: var(--accent-color, #16a34a);
      letter-spacing: 1px;
    }

    .gc-player-name {
      font-size: clamp(22px, 2.2vw, 32px);
      font-weight: 900;
      color: var(--text-color, #f1f5f9);
      text-transform: uppercase;
      letter-spacing: 2px;
      line-height: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-shadow: 0 2px 12px rgba(0,0,0,.6);
    }

    .gc-player-team {
      font-size: 12px;
      font-weight: 600;
      color: rgba(255,255,255,.45);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── Score / minute section (right) ─────────────────────────────────── */
    .gc-info {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: center;
      gap: 8px;
      padding: 14px 36px 14px 24px;
      flex-shrink: 0;
      border-left: 1px solid rgba(255,255,255,.07);
    }

    .gc-minute {
      font-size: 14px;
      font-weight: 700;
      color: rgba(255,255,255,.5);
      letter-spacing: 1px;
    }

    .gc-score {
      font-size: clamp(34px, 3.5vw, 48px);
      font-weight: 900;
      color: #fff;
      letter-spacing: 2px;
      line-height: 1;
      text-shadow: 0 2px 16px rgba(0,0,0,.6);
    }

    /* ── Live dot ───────────────────────────────────────────────────────── */
    .gc-live-dot {
      position: absolute;
      bottom: 8px;
      right: 10px;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #22c55e;
      animation: livePulse 2.5s ease infinite;
      z-index: 10;
    }

    .gc-live-dot.error { background: #e63946; animation: none; }

    @keyframes livePulse {
      0%,100% { opacity: 1;   box-shadow: 0 0 0 0   rgba(34,197,94,.6); }
      50%     { opacity: .75; box-shadow: 0 0 0 5px rgba(34,197,94,0);  }
    }

    /* ── Yellow card event ──────────────────────────────────────────────── */
    .gc-bar[data-event-type="card"] {
      --accent-color: var(--card-accent-color, #f5c518);
    }

    .gc-bar[data-event-type="card"] .gc-badge-text-card {
      letter-spacing: 1.5px;
      font-size: 11px;
      text-align: center;
      line-height: 1.4;
    }

    /* ── Red card event ────────────────────────────────────────────────── */
    .gc-bar[data-event-type="red-card"] {
      --accent-color: var(--red-card-accent-color, #dc2626);
    }

    .gc-bar[data-event-type="red-card"] .gc-badge-text-red-card {
      letter-spacing: 1.5px;
      font-size: 11px;
      text-align: center;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <div id="goal-card">
    <div class="gc-bar">

      <!-- Left: GOL! badge -->
      <div class="gc-badge">
        <!-- Ball SVG (inline, same as the site uses) -->
        <svg class="gc-badge-icon" id="gc-badge-ball" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">

          <path fill="#171717" d="M60.9 39.79c-.09-.05-9.34-5.36-16.52-8.02c-7.48-2.77-13-4.26-13.06-4.27l1.03-3.86c.23.06 5.75 1.54 13.42 4.39c7.5 2.78 16.74 8.08 17.13 8.31zm16.267-10.436L82.61 9.932l3.852 1.079l-5.442 19.422zM117.6 54.52c-.05-.02-5.37-2.04-11.31-3.65c-4.47-1.21-10.23-2.44-10.29-2.45l.83-3.91c.24.05 5.92 1.26 10.5 2.5c6.15 1.66 11.47 3.69 11.7 3.77zM86.13 93.76c0-.06-.5-6.16-1.7-12.4c-1.19-6.16-3.46-11.96-3.48-12.01l3.72-1.47c.1.25 2.43 6.19 3.69 12.73c1.24 6.47 1.74 12.58 1.76 12.84zm19.89 5.56l-2.64-3.01c.04-.03 3.88-3.43 8.62-9.83c4.38-5.92 6.4-11.1 6.42-11.16l3.73 1.43c-.09.23-2.24 5.75-6.94 12.1c-5.01 6.78-9.02 10.32-9.19 10.47M32.847 78.88L55.99 58.223l2.664 2.984L35.51 81.864zM12.91 73.35c-.06-.39-1.38-9.64-1.38-18.1c0-8.44.96-16.25 1.01-16.58l3.97.5c-.01.08-.97 7.9-.97 16.08c0 8.16 1.33 17.44 1.34 17.53zm58.39 40.3c-.25-.03-6.35-.8-16.9-3.9c-6.72-1.98-14.4-6.04-14.73-6.21l1.88-3.53c.08.04 7.65 4.05 13.98 5.91c10.2 3 16.2 3.76 16.26 3.77z"/>

        </svg>
        <!-- Yellow card icon (shown instead of ball for card events) -->
        <svg class="gc-badge-icon" id="gc-badge-card" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 54 76" style="display:none">
          <rect x="3" y="3" width="48" height="70" rx="5" ry="5" fill="#fff" opacity=".88" stroke="rgba(0,0,0,.2)" stroke-width="2"/>
        </svg>
        <!-- Red card icon (shown instead of ball for red card events) -->
        <svg class="gc-badge-icon" id="gc-badge-red-card" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 54 76" style="display:none">
          <rect x="3" y="3" width="48" height="70" rx="5" ry="5" fill="#fff" opacity=".88" stroke="rgba(0,0,0,.2)" stroke-width="2"/>
        </svg>
        <span class="gc-badge-text" id="gc-badge-text-goal">GOL!</span>
        <span class="gc-badge-text gc-badge-text-card" id="gc-badge-text-card" style="display:none">ŽUTI<br>KARTON</span>
        <span class="gc-badge-text gc-badge-text-red-card" id="gc-badge-text-red-card" style="display:none">CRVENI<br>KARTON</span>
      </div>

      <!-- Team logo -->
      <div class="gc-team-logo-wrap" id="gc-team-logo-wrap">
        <img class="gc-team-logo" id="gc-team-logo" src="" alt=""
             onerror="this.closest('.gc-team-logo-wrap').style.display='none'">
      </div>

      <!-- Player info (center) -->
      <div class="gc-player">
        <div class="gc-photo-wrap" id="gc-photo-wrap">
          <img class="gc-photo" id="gc-player-photo" src="" alt=""
               onerror="this.style.display='none'">
        </div>
        <div class="gc-player-info">
          <span class="gc-player-num"  id="gc-player-num"></span>
          <span class="gc-player-name" id="gc-player-name">—</span>
          <span class="gc-player-team" id="gc-player-team"></span>
        </div>
      </div>

      <!-- Minute + score (right) -->
      <div class="gc-info">
        <span class="gc-minute" id="gc-minute"></span>
        <span class="gc-score"  id="gc-score"></span>
      </div>

      <!-- Live dot -->
      <div class="gc-live-dot" id="gc-live-dot"></div>
    </div>
  </div>

  <script>
    'use strict';

    // ── State ─────────────────────────────────────────────────────────────────

    let seenGoalCount    = -1;   // -1 = not yet initialised
    let seenCardCount    = -1;
    let seenRedCardCount = -1;
    let goalQueue     = [];
    let isShowingGoal = false;
    let pollTimer     = null;
    let settingsTimer = null;

    let refreshInterval  = 10000;
    let displayDuration  = 8000;
    let homeTeamData     = {};
    let awayTeamData     = {};

    const card      = document.getElementById('goal-card');
    const liveDot   = document.getElementById('gc-live-dot');

    // ── CSS variable helpers ──────────────────────────────────────────────────

    function applyCssVars(go) {
      const root = document.documentElement;
      root.style.setProperty('--bg-color',             go.bgColor            || '#0a0d1a');
      root.style.setProperty('--accent-color',          go.accentColor         || '#16a34a');
      root.style.setProperty('--card-accent-color',     go.cardAccentColor     || '#f5c518');
      root.style.setProperty('--red-card-accent-color', go.redCardAccentColor  || '#dc2626');
      root.style.setProperty('--text-color',            go.textColor           || '#f1f5f9');
    }

    function applyLogoBackground(enabled) {
      document.getElementById('gc-team-logo-wrap')
        .classList.toggle('gc-team-logo-wrap--bg', !!enabled);
    }

    function proxyUrl(url) {
      return url ? `/api/proxy-image?url=${encodeURIComponent(url)}` : '';
    }

    function setLiveDot(ok) {
      liveDot.classList.toggle('error', !ok);
    }

    // ── Settings ──────────────────────────────────────────────────────────────

    async function fetchSettings() {
      try {
        const res = await fetch('/api/settings');
        if (!res.ok) return;
        const s = await res.json();
        refreshInterval = Math.max(1, Number(s.refreshInterval) || 10) * 1000;
        const go = s.goalOverlay || {};
        displayDuration = Math.max(1, Number(go.displayDuration) || 8) * 1000;
        applyCssVars(go);
        applyLogoBackground(s.logoBackground !== false);
      } catch (_) {}
    }

    // ── Baseline initialisation ───────────────────────────────────────────────
    // On first load we record the current goal count so we only react to NEW
    // goals that appear after the overlay was started.

    async function initBaseline() {
      try {
        const res = await fetch('/api/goal-events');
        if (!res.ok) { seenGoalCount = 0; seenCardCount = 0; seenRedCardCount = 0; setLiveDot(false); return; }
        const data = await res.json();
        homeTeamData     = data.homeTeam || {};
        awayTeamData     = data.awayTeam || {};
        seenGoalCount    = data.goals.length;
        seenCardCount    = (data.cards || []).length;
        seenRedCardCount = (data.redCards || []).length;
        setLiveDot(true);
      } catch (_) {
        seenGoalCount    = 0;
        seenCardCount    = 0;
        seenRedCardCount = 0;
        setLiveDot(false);
      }
    }

    // ── Polling ───────────────────────────────────────────────────────────────

    async function poll() {
      try {
        const res = await fetch('/api/goal-events');
        if (!res.ok) { setLiveDot(false); return; }
        const data = await res.json();
        setLiveDot(true);

        homeTeamData = data.homeTeam || {};
        awayTeamData = data.awayTeam || {};

        if (seenGoalCount === -1) {
          // Shouldn't normally happen (initBaseline runs first), but be safe
          seenGoalCount    = data.goals.length;
          seenCardCount    = (data.cards || []).length;
          seenRedCardCount = (data.redCards || []).length;
          return;
        }

        // Resync if counts went backward (e.g. after a mock reset)
        if (data.goals.length < seenGoalCount)               seenGoalCount    = data.goals.length;
        if ((data.cards    || []).length < seenCardCount)    seenCardCount    = (data.cards    || []).length;
        if ((data.redCards || []).length < seenRedCardCount) seenRedCardCount = (data.redCards || []).length;

        if (data.goals.length > seenGoalCount) {
          const newGoals = data.goals.slice(seenGoalCount);
          seenGoalCount  = data.goals.length;
          goalQueue.push(...newGoals.map(g => ({ ...g, type: 'goal' })));
          processQueue();
        }

        const cards = data.cards || [];
        if (cards.length > seenCardCount) {
          const newCards = cards.slice(seenCardCount);
          seenCardCount  = cards.length;
          goalQueue.push(...newCards.map(c => ({ ...c, type: 'card' })));
          processQueue();
        }

        const redCards = data.redCards || [];
        if (redCards.length > seenRedCardCount) {
          const newRedCards = redCards.slice(seenRedCardCount);
          seenRedCardCount  = redCards.length;
          goalQueue.push(...newRedCards.map(c => ({ ...c, type: 'red-card' })));
          processQueue();
        }
      } catch (_) {
        setLiveDot(false);
      }
    }

    function schedulePoll() {
      pollTimer = setTimeout(async () => {
        await poll();
        schedulePoll();
      }, refreshInterval);
    }

    function scheduleSettingsRefresh() {
      settingsTimer = setTimeout(async () => {
        await fetchSettings();
        scheduleSettingsRefresh();
      }, 10000);
    }

    // ── Goal display queue ────────────────────────────────────────────────────

    function processQueue() {
      if (isShowingGoal || goalQueue.length === 0) return;
      showGoal(goalQueue.shift());
    }

    function showGoal(event) {
      isShowingGoal = true;

      // Safety net: if the animation chain breaks for any reason (JS error, OBS
      // throttling, etc.) this timer ensures isShowingGoal is always reset so
      // future events are not permanently blocked.
      const safetyTimer = setTimeout(() => {
        card.classList.remove('sliding-in', 'sliding-out');
        isShowingGoal = false;
        processQueue();
      }, displayDuration + 3000);

      const type = event.type || 'goal';
      const team = event.isAway ? awayTeamData : homeTeamData;

      // Switch badge between goal / yellow card / red card modes
      const bar = document.querySelector('.gc-bar');
      bar.dataset.eventType = type;
      document.getElementById('gc-badge-ball').style.display          = type === 'goal'     ? '' : 'none';
      document.getElementById('gc-badge-card').style.display          = type === 'card'     ? '' : 'none';
      document.getElementById('gc-badge-red-card').style.display      = type === 'red-card' ? '' : 'none';
      document.getElementById('gc-badge-text-goal').style.display     = type === 'goal'     ? '' : 'none';
      document.getElementById('gc-badge-text-card').style.display     = type === 'card'     ? '' : 'none';
      document.getElementById('gc-badge-text-red-card').style.display = type === 'red-card' ? '' : 'none';

      // Populate DOM
      const numEl   = document.getElementById('gc-player-num');
      const nameEl  = document.getElementById('gc-player-name');
      const teamEl  = document.getElementById('gc-player-team');
      const minEl   = document.getElementById('gc-minute');
      const scoreEl = document.getElementById('gc-score');
      const photoEl = document.getElementById('gc-player-photo');
      const logoEl  = document.getElementById('gc-team-logo');
      const logoWrap= document.getElementById('gc-team-logo-wrap');

      numEl.textContent   = event.playerNum  ? `#${event.playerNum}` : '';
      nameEl.textContent  = event.playerName || '—';
      teamEl.textContent  = team.name        || '';
      minEl.textContent   = event.minute     ? `${event.minute}'`   : '';
      // Goals show score after; cards show nothing in the score slot
      scoreEl.textContent = type === 'goal' ? (event.scoreAfter || '').replace('-', ' - ') : '';

      if (event.playerImg) {
        photoEl.src          = proxyUrl(event.playerImg);
        photoEl.style.display = '';
      } else {
        photoEl.style.display = 'none';
      }

      if (team.logo) {
        logoEl.src           = proxyUrl(team.logo);
        logoEl.style.display = '';
        logoWrap.style.display = '';
      } else {
        logoWrap.style.display = 'none';
      }

      // Slide in
      card.classList.remove('sliding-out');
      void card.offsetWidth; // force reflow so transition fires
      card.classList.add('sliding-in');

      // After displayDuration, slide out
      setTimeout(() => {
        card.classList.remove('sliding-in');
        void card.offsetWidth;
        card.classList.add('sliding-out');

        // After slide-out animation completes, allow next event
        setTimeout(() => {
          clearTimeout(safetyTimer);
          card.classList.remove('sliding-out');
          isShowingGoal = false;
          processQueue();
        }, 650);
      }, displayDuration);
    }

    // ── Preview mode (?preview=goal|card|red-card) ────────────────────────────
    // Opening the URL with this param shows the card statically with dummy data
    // so you can inspect the design without needing a live match.

    function showPreview(event) {
      const type = event.type || 'goal';
      const team = event.isAway ? awayTeamData : homeTeamData;

      const bar = document.querySelector('.gc-bar');
      bar.dataset.eventType = type;

      document.getElementById('gc-badge-ball').style.display          = type === 'goal'     ? '' : 'none';
      document.getElementById('gc-badge-card').style.display          = type === 'card'     ? '' : 'none';
      document.getElementById('gc-badge-red-card').style.display      = type === 'red-card' ? '' : 'none';
      document.getElementById('gc-badge-text-goal').style.display     = type === 'goal'     ? '' : 'none';
      document.getElementById('gc-badge-text-card').style.display     = type === 'card'     ? '' : 'none';
      document.getElementById('gc-badge-text-red-card').style.display = type === 'red-card' ? '' : 'none';

      document.getElementById('gc-player-num').textContent  = '#10';
      document.getElementById('gc-player-name').textContent = 'MARKO PETROVIĆ';
      document.getElementById('gc-player-team').textContent = team.name || 'IT CUP TEAM';
      document.getElementById('gc-minute').textContent      = type === 'goal' ? "45'" : type === 'card' ? "32'" : "67'";
      document.getElementById('gc-score').textContent       = type === 'goal' ? '1 - 0' : '';
      document.getElementById('gc-player-photo').style.display = 'none';

      const logoEl   = document.getElementById('gc-team-logo');
      const logoWrap = document.getElementById('gc-team-logo-wrap');
      if (team.logo) {
        logoEl.src             = proxyUrl(team.logo);
        logoEl.style.display   = '';
        logoWrap.style.display = '';
      } else {
        logoWrap.style.display = 'none';
      }

      // Show card immediately without slide animation
      card.style.transition = 'none';
      card.style.transform  = 'translateY(0)';
    }

    // ── Boot ──────────────────────────────────────────────────────────────────

    async function init() {
      await fetchSettings();

      const previewType = new URLSearchParams(location.search).get('preview');
      if (previewType && ['goal', 'card', 'red-card'].includes(previewType)) {
        // Preview mode — load real team data if available, then show card statically
        try {
          const res = await fetch('/api/goal-events');
          if (res.ok) {
            const data = await res.json();
            homeTeamData = data.homeTeam || {};
            awayTeamData = data.awayTeam || {};
          }
        } catch (_) {}
        showPreview({ type: previewType, isAway: false });
        // Keep refreshing settings so color changes in settings.html are reflected live
        scheduleSettingsRefresh();
      } else {
        await initBaseline();
        schedulePoll();
        scheduleSettingsRefresh();
      }
    }

    init();
  </script>
</body>
</html>
